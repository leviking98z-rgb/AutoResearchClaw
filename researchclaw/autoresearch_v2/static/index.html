<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>AutoResearch v2 · Multi-Idea Lab</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <div>
        <small>TRANSACTIONAL · CONTINUOUS · MULTI-IDEA</small>
        <h1>AutoResearch v2</h1>
      </div>
      <div class="actions">
        <span id="connection">连接中</span>
        <button id="pause">暂停准入</button>
        <button id="resume">恢复</button>
        <button id="stop" class="danger">停止</button>
        <button id="refresh">刷新</button>
      </div>
    </header>
    <main>
      <section id="metrics" class="metrics"></section>
      <section class="usage-shell">
        <div class="section-head">
          <div>
            <small>ACCOUNTING · BUDGETS · ALERTS</small>
            <h2>Usage Monitor</h2>
          </div>
          <div class="actions">
            <label>
              Window
              <select id="usage-window">
                <option value="24">24h</option>
                <option value="168" selected>7d</option>
                <option value="720">30d</option>
              </select>
            </label>
          </div>
        </div>
        <section id="usage-summary" class="usage-summary"></section>
        <section class="usage-grid">
          <article>
            <div class="panel-head">
              <h3>Token Trend</h3>
              <span id="burn-rate" class="muted"></span>
            </div>
            <div id="token-trend" class="chart"></div>
          </article>
          <article>
            <div class="panel-head">
              <h3>By Role / Model</h3>
              <span id="pricing-coverage" class="muted"></span>
            </div>
            <div id="usage-breakdown"></div>
          </article>
          <article>
            <div class="panel-head">
              <h3>GPU Utilization</h3>
              <span id="gpu-usage-meta" class="muted"></span>
            </div>
            <div id="gpu-trend" class="chart"></div>
            <div id="gpu-states" class="gpu-states"></div>
          </article>
          <article>
            <div class="panel-head">
              <h3>Budget Pressure</h3>
              <span id="monthly-budget-meta" class="muted"></span>
            </div>
            <div id="budget-pressure"></div>
          </article>
        </section>
        <section class="usage-grid bottom">
          <article>
            <div class="panel-head">
              <h3>Alerts</h3>
              <span id="alert-count" class="muted"></span>
            </div>
            <div id="usage-alerts"></div>
          </article>
          <article>
            <div class="panel-head">
              <h3>Top Ideas by Usage</h3>
              <span class="muted">click to inspect</span>
            </div>
            <div id="usage-ideas"></div>
          </article>
        </section>
      </section>
      <section id="board" class="board"></section>
      <section class="lower">
        <article>
          <h2>GPU Pool</h2>
          <div id="gpu"></div>
        </article>
        <article>
          <h2>最近事件</h2>
          <div id="events"></div>
        </article>
      </section>
      <section class="detail">
        <div class="detail-head">
          <div>
            <h2>Idea / Job / Attempt Drill-down</h2>
            <p id="detail-title">点击任意 Idea 查看事务与日志</p>
          </div>
          <div id="log-actions" class="actions"></div>
        </div>
        <div id="detail"></div>
      </section>
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
