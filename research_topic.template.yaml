non_negotiable_rules:
  - "Do not fabricate citations or numeric results."
  - "Preserve raw logs, seeds, commands, and machine-readable metrics."
  - "A null or negative result is an acceptable final outcome."
  - "Human approval is required before presenting the draft as publishable."

