title: ""
research_question: ""
hypothesis: ""
why_it_might_be_novel: ""

seed_papers:
  - title_or_url: ""

baseline_repositories:
  - url: ""
    commit: ""
    run_command: ""

datasets:
  - name: ""
    location_or_url: ""
    license: ""

primary_metric:
  name: ""
  direction: "maximize"  # maximize | minimize

required_experiments:
  - "main comparison"
  - "ablation"
  - "three or more random seeds when stochastic"
  - "runtime and memory comparison"
  - "error or failure-case analysis"

compute_budget:
