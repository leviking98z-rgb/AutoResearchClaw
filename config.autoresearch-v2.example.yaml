autoresearch_v2:
  enabled: false
  system_id: rsi-autoresearch-v2
  state_dir: /root/shared/.clusters/.workdir/autoresearch-v2/runs/rsi
  topic_brief: >-
    Discover mechanistic, falsifiable, compute-efficient research questions
    about recursive self-improvement and self-iterative optimization of LLMs
    and LLM agents. Prefer ideas with valuable negative results.

  population:
    reservoir_low_watermark: 12
    reservoir_target: 24
    generation_batch_size: 12
    active_idea_target: 8
    max_active_ideas: 10
    max_same_family: 2
  admission:
    minimum_score: 6.0
    duplicate_threshold: 0.72
    semantic_duplicate_threshold: 0.72
    require_novelty_evidence: true

  concurrency:
    max_llm_jobs: 4
    max_cpu_jobs: 8
    max_gpu_jobs: 8
    poll_interval_sec: 2

  budgets:
    max_build_attempts: 2
    # Design repairs happen inside one immutable attempt so the worker and
    # Decision board can converge without restarting from another Job attempt.
    max_design_revisions: 2
    max_job_attempts: 3
    pilot_gpu_hours: 2
    scale_gpu_hours: 32
    max_llm_tokens_per_idea: 2000000
    max_wall_clock_hours_per_idea: 72
    max_no_progress_hours: 12

  retention:
    event_jsonl_max_mb: 256
    llm_audit_max_mb: 256
    keep_failed_attempts_per_job: 4
    maintenance_interval_ticks: 300

  execution:
    # Must exist on every GPU node. Commands remain structured argv; generated
    # shell programs are rejected.
    python_executable: /opt/conda/envs/torch-base/bin/python3
    # Leave empty to create a 0600 key under state_dir, or point at a
    # Controller-only shared path outside Idea candidates.
    attestation_key_file: ""
    attestation_key_id: autoresearch-v2-controller
    smoke_timeout_sec: 300
    # auto: use the GPU pool whenever gpu.enabled=true, otherwise local.
    # This prevents Controller-host dependency gaps from rejecting valid code.
    smoke_environment: auto

  gpu:
    enabled: false
    # resource_manager requests/renews/reconciles ClusterBridge capacity and
    # hot-attaches the resulting broker without restarting the Controller.
    # Use static_pool plus pool_config to adopt a preclaimed legacy pool.
    mode: resource_manager
    pool_config: ""
    resource_manager:
      # Stable AgentMail/ClusterBridge owner identity for this service.
      owner: 00000000-0000-0000-0000-000000000000
      cb_command: /root/shared/.clusters/.tools/clusterbridge.sh
      project: AutoResearchClaw-v2
      purpose: AutoResearch v2 continuous multi-Idea experiments
      min_gpus: 8
      desired_gpus: 56
      max_gpus: 64
      duration_min: 1440
      renew_ttl_min: 1440
      renew_interval_sec: 900
      reconcile_interval_sec: 15
      allow_cross_cluster: true
      gpu_type: H20
      priority: normal
      # false preserves the allocation across a routine Controller restart.
      # Set true only when every shutdown should return capacity immediately.
      release_on_shutdown: false
      log_root: /root/shared/.clusters/.tmp/autoresearch-v2/elastic-pools
    reserved_gpus: 0
    target_utilization: 0.90
    max_share_per_idea: 0.50
    pilot_max_gpus: 2
    scale_max_gpus: 8
    probe_failure_threshold: 3
    # This path must be visible with the same absolute name on all GPU nodes.
    shared_workspace_root: /root/shared/.clusters/.workdir/autoresearch-v2/runs

  models:
    researchclaw_config: config.rsi.yaml
    decision_role: research_director
    worker_role: coding_engineer
    utility_role: literature_researcher

  literature:
    enabled: true
    mode: http
    url: http://127.0.0.1:8077
    repo: /root/servers/infohub
    timeout_sec: 20
    search_limit: 30
    collect_days: 3650
    collect_platforms: [arxiv, scholar, bing]
    refresh_on_low_results: true
    min_results: 8

  # InfoHub is a searchable Research Memory projection, not the scientific
  # source of truth. SQLite plus immutable attempt artifacts remain canonical.
  research_memory:
    enabled: true
    url: http://127.0.0.1:8077
    timeout_sec: 10
    reconcile_interval_ticks: 15

  # Audit accounting is exact for recorded CLI calls. Dollar values are only
  # estimates when explicit provider/contract rates are configured below.
  usage_monitoring:
    enabled: true
    history_hours: 168
    bucket_minutes: 60
    warning_threshold: 0.50
    critical_threshold: 0.80
    token_burn_warning_per_hour: 1000000
    single_call_token_warning: 100000
    gpu_idle_warning_minutes: 30
    # Zero means unset, so no monthly pressure alert is emitted.
    monthly_token_budget: 0
    monthly_gpu_hours_budget: 0
    monthly_cost_budget_usd: 0
    gpu_hour_cost_usd: 0
    # Populate only with known billing rates, for example:
    # model_prices:
    #   provider/model:
    #     input_per_million_usd: 0
    #     output_per_million_usd: 0
    model_prices: {}
