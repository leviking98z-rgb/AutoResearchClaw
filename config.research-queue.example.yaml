research_queue:
  enabled: false
  system_id: research-queue-prototype
  # Keep SQLite/controller state on local disk. For ClusterBridge, point
  # artifact_dir at shared CephFS so remote workers can see revisions/results.
  state_dir: workspace/research-queue-prototype
  artifact_dir: ""

  # Use either inline brief or brief_file.
  brief: >-
    Study a small, falsifiable computational research question. Prefer cheap
    experiments with a clear treatment, compute-matched control, and one
    primary metric.
  brief_file: ""

  limits:
    candidate_target: 6
    generation_batch_size: 2
    # Minimum delay between generation batches. Use e.g. 21600 for four
    # bounded waves during a 24-hour unattended canary.
    generation_interval_sec: 0
    # 0 means unlimited. A 24-hour canary can set 4 to guarantee no more than
    # four paid generation calls even if a batch is rejected.
    generation_max_batches: 0
    max_active_ideas: 4
    # Zero means continuous. Set a finite number for --until-idle tests.
    max_total_ideas: 0
    # Hard stop for unattended real-LLM canaries. Zero disables the cap.
    max_total_tokens: 0
    max_revisions_per_idea: 2
    max_runs_per_budget: 2
    max_steps_per_idea: 10
    # Startup fails if a declared core path is impossible under the limits.
    required_paths: [revise, b2]
    max_infra_retries: 1
    # Number of code-generation repairs before an invalid project is isolated.
    max_prepare_repairs: 1
    duplicate_threshold: 0.78

  concurrency:
    max_llm_jobs: 2
    max_run_jobs: 4
    poll_interval_sec: 0.1
    llm_call_timeout_sec: 1800

  models:
    researchclaw_config: config.rsi.yaml
    decision_role: research_director
    worker_role: coding_engineer
    utility_role: literature_researcher

  execution:
    # local is enough for prototype development. clusterbridge reuses the
    # existing elastic resource-manager adapter.
    backend: local
    python_executable: python
    # true uses deterministic Idea/Prepare/Review workers and spends no tokens.
    simulation: true
    # Standard-library imports are always allowed. List only permitted
    # third-party top-level modules here.
    allowed_python_imports:
      - numpy
    # ClusterBridge workers cannot see a controller-only checkout. Sync or
    # install researchclaw under shared storage and point PYTHONPATH there.
    remote_pythonpath: ""

  # Optional bridge from a synthetic pilot Idea to a real pinned benchmark.
  # Keep disabled for generic prototype runs.
  scientific_gate:
    enabled: false
    require_structured_spec: true
    max_repairs: 1

  promotion:
    enabled: false
    benchmark_id: cifar10_calibration
    # A pinned adapter config. For ClusterBridge this path must be visible under
    # /root/shared on both the controller and GPU node. Use at least 2 seeds
    # for a smoke-test CI and at least 5 for a confirmatory ResearchSpec.
    benchmark_config: ""
    trigger_conclusions: [positive, inconclusive]
    minimum_priority: 0.0
    minimum_effect: 0.0
    max_promotions: 1
    max_treatment_repairs: 1
    preflight_examples: 96
    preflight_classes: 10
    preflight_timeout_sec: 20
    # Use the node environment containing torch/pyarrow for real GPU runs.
    runtime_python: /opt/conda/envs/torch-base/bin/python
    # Optional pinned logits cache. Once built by a real GPU inference pass,
    # later treatments can be evaluated on CPU without re-requesting a GPU.
    logits_cache: ""
    prefer_logits_cache: true
    # Benchmark ablation only: bypass B0/B1 and send every admitted Idea to
    # the frozen benchmark. Keep false for the normal early-exit queue.
    direct_all_admitted: false

  # Best-effort searchable projection. SQLite and Idea artifacts remain the
  # scientific source of truth.
  research_memory:
    enabled: false
    url: http://127.0.0.1:8077
    timeout_sec: 10

  gpu:
    # Logical maximum. local mode only simulates slots; clusterbridge mode
    # requests real capacity only while a prepared Run is waiting/running.
    max_total_gpus: 4
    max_gpus_per_run: 2
    poll_interval_sec: 1
    pass_env: []
    resource_manager:
      owner: ""
      cb_command: /root/shared/.clusters/.tools/clusterbridge.sh
      project: ResearchQueuePrototype
      purpose: Continuous Research Queue prototype runs
      max_gpus: 4
      duration_min: 120
      renew_ttl_min: 120
      renew_interval_sec: 300
      reconcile_interval_sec: 2
      allow_cross_cluster: true
      gpu_type: H20
      priority: normal
      release_on_shutdown: true
      log_root: /root/shared/.clusters/.tmp/research-queue-prototype

  budgets:
    B0:
      gpus: 1
      timeout_sec: 120
      parameters:
        examples: 8
        seeds: 1
    B1:
      gpus: 2
      timeout_sec: 600
      parameters:
        examples: 32
        seeds: 2
    B2:
      gpus: 2
      timeout_sec: 1800
      parameters:
        examples: 64
        seeds: 3
