project:
  name: "autoresearch-local-smoke"
  mode: "full-auto"

research:
  topic: "Create a reproducible CPU-only comparison of two estimators on synthetic data with known ground truth."
  domains: ["statistics", "simulation"]
  daily_paper_count: 2
  quality_threshold: 2.0
  graceful_degradation: true

runtime:
  timezone: "Asia/Beijing"
  max_parallel_tasks: 1
  approval_timeout_hours: 1
  retry_limit: 0

notifications:
  channel: "console"
  target: ""
  on_stage_start: false
  on_stage_fail: true
  on_gate_required: false

knowledge_base:
  backend: "markdown"
  root: "workspace/smoke-kb"

llm:
  provider: "acp"
  base_url: ""
  api_key_env: ""
  api_key: ""
  primary_model: ""
  fallback_models: []
  timeout_sec: 600
  acp:
    agent: "cursor"
    cwd: "."
    acpx_command: "/root/.nvm/versions/node/v22.23.1/bin/acpx"
    session_name: "researchclaw-smoke"
    timeout_sec: 600

literature_search:
  sources: ["arxiv"]
  max_results_per_query: 2
  inter_query_delay_sec: 0.2

web_search:
  enabled: false
  enable_scholar: false
  enable_crawling: false
  enable_pdf_extraction: false
  max_web_results: 1
  max_scholar_results: 1
  max_crawl_urls: 1

security:
  hitl_required_stages: [5, 9, 20]
  allow_publish_without_approval: false
  redact_sensitive_logs: true

experiment:
  mode: "docker"
  time_budget_sec: 60
  max_iterations: 1
  metric_key: "primary_metric"
  metric_direction: "maximize"
  sandbox:
    python_path: ".venv/bin/python3"
    gpu_required: false
    max_memory_mb: 2048
  docker:
    image: "researchclaw/sandbox-generic:latest"
    gpu_enabled: false
    memory_limit_mb: 2048
    network_policy: "none"
    auto_install_deps: true
    shm_size_mb: 512
    keep_containers: false
  cli_agent:
    provider: "cursor"
    binary_path: "/root/.local/bin/cursor-agent"
    model: "gpt-5.3-codex"
    timeout_sec: 180
  code_agent:
    enabled: false
  opencode:
    enabled: false
    auto: false
  benchmark_agent:
    enabled: false
  figure_agent:
    enabled: false
    nano_banana_enabled: false
  repair:
    enabled: false

export:
  target_conference: "generic"
  authors: "Anonymous"
  bib_file: "references"

hitl:
  enabled: false
  mode: "full-auto"
  cost_budget_usd: 0.0
