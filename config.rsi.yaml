project:
  name: "autoresearch-rsi"
  mode: "full-auto"

research:
  topic: "PLACEHOLDER: replace this with a concrete, falsifiable research question before the first production run."
  autonomous_topic_selection: true
  domains:
    - "computational-research"
  daily_paper_count: 8
  quality_threshold: 4.0
  graceful_degradation: false

runtime:
  timezone: "Asia/Beijing"
  max_parallel_tasks: 1
  approval_timeout_hours: 24
  retry_limit: 2
  stage_cache_enabled: true
  stage_cache_dir: ""
  stage_cache_literature_ttl_hours: 24

notifications:
  channel: "console"
  target: ""
  on_stage_start: true
  on_stage_fail: true
  on_gate_required: true

knowledge_base:
  backend: "markdown"
  root: "workspace/kb"

openclaw_bridge:
  use_cron: false
  use_message: false
  use_memory: false
  use_sessions_spawn: false
  use_web_fetch: false
  use_browser: false

# The local Bridge is the API transport; CodeBuddy is the authenticated CLI
# runtime behind it, not a model. Research work is deliberately limited to
# three model tiers so routing remains understandable and auditable.
llm:
  provider: "openai-compatible"
  base_url: "http://127.0.0.1:8787/v1"
  wire_api: "chat_completions"
  api_key_env: "BRIDGE_LOCAL_API_KEY"
  api_key: ""
  primary_model: "codebuddy/claude-sonnet-5"
  fallback_models: []
  timeout_sec: 1800

  model_tiers:
    # Final topic/continue/pivot/kill and claim-evidence decisions.
    decision:
      model: "codebuddy/gpt-5.6-sol"
      fallback_models: []
    # Main scientific reasoning, experiment/code work, analysis, and writing.
    worker:
      model: "codebuddy/claude-sonnet-5"
      fallback_models: []
    # High-volume search/extraction/organization/operations work.
    utility:
      model: "codebuddy/claude-haiku-4.5"
      fallback_models: []

  # Roles keep separate prompts, tools, sessions, and audit logs. When these
  # tiers are configured, roles cannot override their tier's model.
  roles:
    topic_selector:
      temperature: 0.65
      max_tokens: 16000
      isolated_session: true
      tools: ["campaign_brief", "topic_history"]
    campaign_director:
      temperature: 0.2
      max_tokens: 6000
      isolated_session: true
      tools: ["cycle_evidence", "topic_history"]
    research_director:
      temperature: 0.3
      max_tokens: 8192
      isolated_session: true
    literature_researcher:
      temperature: 0.2
      max_tokens: 8192
      isolated_session: true
      tools: ["openalex", "semantic_scholar", "arxiv", "web_search"]
    idea_scientist:
      temperature: 0.75
      max_tokens: 12288
      isolated_session: true
      tools: ["literature_evidence", "novelty_check"]
    experiment_designer:
      temperature: 0.25
      max_tokens: 12288
      isolated_session: true
      tools: ["benchmark_agent", "hardware_profile"]
    coding_engineer:
      temperature: 0.1
      max_tokens: 32768
      isolated_session: true
      tools: ["filesystem", "python", "clusterbridge"]
    compute_operator:
      temperature: 0.1
      max_tokens: 8192
      isolated_session: true
      tools: ["clusterbridge", "ray", "run_logs"]
    result_analyst:
      temperature: 0.1
      max_tokens: 12288
      isolated_session: true
      tools: ["raw_results", "statistics"]
    paper_writer:
      temperature: 0.35
      max_tokens: 32768
      isolated_session: true
      tools: ["verified_evidence", "figures"]
    skeptical_reviewer:
      temperature: 0.0
      max_tokens: 12288
      isolated_session: true
      tools: ["read_only_artifacts", "raw_results"]
    citation_auditor:
      temperature: 0.0
      max_tokens: 8192
      isolated_session: true
      tools: ["bibliography", "citation_verifier"]

literature_search:
  sources:
    - "openalex"
    - "semantic_scholar"
    - "arxiv"
  max_results_per_query: 25
  inter_query_delay_sec: 1.5
  openalex_email: "researchclaw@users.noreply.github.com"
  openalex_api_key_env: "OPENALEX_API_KEY"
  openalex_api_key: ""
  s2_api_key_env: "S2_API_KEY"
  s2_api_key: ""
  infohub_enabled: true
  infohub_mode: "http"
  infohub_url: "http://127.0.0.1:8077"
  infohub_repo: "/root/servers/infohub"
  infohub_timeout_sec: 20
  infohub_search_limit: 60
  infohub_collect_days: 3650
  infohub_collect_platforms:
    - "arxiv"
    - "scholar"
    - "bing"
  infohub_min_results: 15
  infohub_refresh: true

web_search:
  enabled: true
  tavily_api_key_env: "TAVILY_API_KEY"
  tavily_api_key: ""
  enable_scholar: true
  enable_crawling: true
  enable_pdf_extraction: true
  max_web_results: 8
  max_scholar_results: 10
  max_crawl_urls: 4

security:
  hitl_required_stages: [5, 9, 20]
  allow_publish_without_approval: false
  redact_sensitive_logs: true

# CPU-safe first installation. Generated experiment code is executed inside a
# non-root Docker container with no GPU passthrough and a hard memory/time cap.
experiment:
  mode: "clusterbridge_pool"
  time_budget_sec: 1800
  max_iterations: 3
  max_refine_duration_sec: 900
  metric_key: "primary_metric"
  metric_direction: "maximize"
  keep_threshold: 0.0

  sandbox:
    python_path: ".venv/bin/python3"
    gpu_required: true
    allowed_imports:
      - math
      - random
      - json
      - csv
      - numpy
      - scipy
      - pandas
      - matplotlib
      - sklearn
    max_memory_mb: 4096

  docker:
    image: "researchclaw/sandbox-generic:latest"
    gpu_enabled: false
    memory_limit_mb: 8192
    network_policy: "none"
    pip_pre_install: []
    auto_install_deps: true
    shm_size_mb: 1024
    keep_containers: false

  # Remote H20 execution over the cluster's shared-CephFS ClusterBridge.
  # Node leases are managed with cb claim/renew/release; no SSH is used.
  clusterbridge:
    node: "28.83.2.169"
    cb_command: "/root/shared/.clusters/.tools/clusterbridge.sh"
    shared_root: "/root/shared/.clusters/.tmp/researchclaw"
    remote_python: "/opt/conda/envs/torch-base/bin/python3"
    gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    setup_commands: []
    network_isolation: true
    cleanup_remote: true
    timeout_sec: 1800
    claim_ttl_min: 180

  # Multi-node execution through the prepared 4-node / 32-GPU Ray pool.
  # Pool claim/cleanup/spin/Ray lifecycle is owned by bin/cluster-pool.
  clusterbridge_pool:
    config_file: "/data/workspace/autoresearch-stack/AutoResearchClaw/config.cluster32.yaml"
    remote_python: "/opt/conda/envs/torch-base/bin/python3"
    setup_commands: []
    # Full `unshare --net` cannot reach Ray GCS. Keep the Ray control plane
    # reachable; install researchclaw-ray-netns for a restricted policy later.
    network_isolation: false
    cleanup_remote: true
    timeout_sec: 1800
    restore_state: true
    require_prepared: true

  # Keep Stage 10/13 code generation on the exact same DeepSeek V4 Pro API.
  cli_agent:
    provider: "llm"
    binary_path: ""
    model: ""
    max_budget_usd: 5.0
    timeout_sec: 900
    extra_args: []

  code_agent:
    enabled: true
    architecture_planning: true
    sequential_generation: true
    hard_validation: true
    hard_validation_max_repairs: 3
    exec_fix_max_iterations: 2
    exec_fix_timeout_sec: 90
    tree_search_enabled: false
    review_max_rounds: 2

  # OpenCode is intentionally disabled: ACP + Cursor is the configured backend,
  # and using another agent would add an unconfigured credential dependency.
  opencode:
    enabled: false
    auto: false
    complexity_threshold: 1.0
    model: ""
    timeout_sec: 600
    max_retries: 0
    workspace_cleanup: true

  benchmark_agent:
    enabled: true
    enable_hf_search: true
    max_hf_results: 8
    enable_web_search: true
    max_web_results: 5
    web_search_min_local: 3
    tier_limit: 1
    min_benchmarks: 1
    min_baselines: 2
    prefer_cached: true
    max_iterations: 1

  figure_agent:
    enabled: true
    min_figures: 2
    max_figures: 6
    max_iterations: 2
    render_timeout_sec: 45
    use_docker: true
    docker_image: "researchclaw/sandbox-generic:latest"
    output_format: "python"
    nano_banana_enabled: false
    strict_mode: true
    dpi: 300

  repair:
    enabled: true
    max_cycles: 2
    min_completion_rate: 0.75
    min_conditions: 2
    use_opencode: false
    timeout_sec_per_cycle: 600

export:
  target_conference: "generic"
  authors: "Anonymous"
  bib_file: "references"

prompts:
  custom_file: ""
  extra_prompts:
    experiment_design: "prompts_extra/experiment_design.md"
    result_analysis: "prompts_extra/result_analysis.md"
    paper_draft: "prompts_extra/paper_draft.md"

hitl:
  enabled: true
  mode: "full-auto"
  cost_budget_usd: 20.0
  notifications:
    on_pause: true
    on_quality_drop: true
    on_error: true
    channels: ["terminal"]
  collaboration:
    max_chat_turns: 50
    save_chat_history: true
  timeouts:
    default_human_timeout_sec: 86400
    auto_proceed_on_timeout: true
  stage_policies: {}

memory:
  enabled: true
  store_dir: "workspace/memory"
  max_entries_per_category: 300
  decay_half_life_days: 90
  confidence_threshold: 0.4
  inject_at_stages: [1, 9, 10, 17]

skills:
  enabled: true
  builtin_dir: ""
  custom_dirs:
    - "/root/shared/.clusters/.workdir/autoresearch-rsi/shared-skills"
  external_dirs: []
  auto_match: true
  max_skills_per_stage: 3
  fallback_matching: true

knowledge_graph:
  enabled: true
  store_path: "workspace/knowledge_graph"
  max_entities: 10000
  auto_update: true

quality_assessor:
  enabled: true
  min_score: 6.0
  auto_revise: true
  max_revisions: 2
  criteria:
    - novelty
    - rigor
    - reproducibility
    - clarity
    - significance

metaclaw_bridge:
  enabled: false
  proxy_url: "http://localhost:30000"
  skills_dir: "~/.metaclaw/skills"
  fallback_url: ""
  fallback_api_key: ""
